name: AURION SEAL

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "SHA-256 hex de 64 caracteres (sin prefijo sha256:)"
        required: true
        type: string
      name:
        description: "Nombre del activo (sin ruta)"
        required: true
        type: string
      kind:
        description: "human | tool | synthetic | mix"
        required: true
        type: choice
        options: [human, tool, synthetic, mix]
        default: human

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  seal:
    name: Sellar hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar digest
        id: v
        run: |
          set -euo pipefail
          D="${{ inputs.digest }}"
          D="${D#sha256:}"
          D="$(echo "$D" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! echo "$D" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "Digest invalido."
            exit 1
          fi
          NAME="$(echo '${{ inputs.name }}' | tr -d '/\\' | cut -c1-120)"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"

      - name: Firmar subject-digest
        uses: actions/attest@v2
        with:
          subject-name: ${{ steps.v.outputs.name }}
          subject-digest: sha256:${{ steps.v.outputs.digest }}
          predicate-type: https://in-toto.io/attestation/release/v0.1
          predicate: |
            {
              "spec": "aurion-provenance/v0",
              "product": "AURION",
              "kind": "${{ steps.v.outputs.kind }}",
              "sealed_by": "rmpsorva/RMP-Studio",
              "note": "Hash-only seal. Media never uploaded."
            }

      - name: Escribir ledger.json
        env:
          DIGEST: ${{ steps.v.outputs.digest }}
          NAME: ${{ steps.v.outputs.name }}
          KIND: ${{ steps.v.outputs.kind }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path = "ledger.json"
          data = json.loads(open(path, encoding="utf-8").read()) if os.path.exists(path) else {"spec":"aurion-provenance/v0","records":[]}
          recs = data.setdefault("records", [])
          digest = os.environ["DIGEST"]
          recs[:] = [r for r in recs if r.get("sha256") != digest]
          recs.append({
            "sha256": digest,
            "kind": os.environ["KIND"],
            "name": os.environ["NAME"],
            "at": datetime.datetime.utcnow().replace(microsecond=0).isoformat()+"Z",
            "run": os.environ["RUN"]
          })
          data["updated_at"] = datetime.datetime.utcnow().replace(microsecond=0).isoformat()+"Z"
          data["repo"] = os.environ.get("GITHUB_REPOSITORY", "rmpsorva/RMP-Studio")
          open(path,"w",encoding="utf-8").write(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "aurion-factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "ledger: ${{ steps.v.outputs.kind }} ${{ steps.v.outputs.digest }}"
          git push
