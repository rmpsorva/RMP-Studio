<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>R.M.P Studio</title>
<style>
:root{--bg:#070707;--gold:#c9a227;--gold2:#e0c36a;--btn:#c4a04a;--text:#f3f3f3;--muted:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:16px 16px 92px}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:12px}
.mark{letter-spacing:.32em;font-size:11px;font-weight:700;color:var(--gold)}
h1{font-size:28px;font-weight:800;margin-top:6px}
.logo{width:52px;height:52px;border-radius:8px;border:1px solid #3a3118}
.sub{font-size:10px;letter-spacing:.12em;text-align:right;margin-top:6px;color:#ccc}
.tag{color:var(--muted);font-size:13px;margin:8px 0 14px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent 85%);opacity:.55;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border:1px solid #1d1d1d;border-radius:16px;padding:14px;min-height:80px}
.card.active{border-color:var(--gold)}
.card span{color:var(--muted);font-size:12px}
.work{margin-top:14px;background:#161616;border:1px solid #1c1c1c;border-radius:18px;padding:16px}
.drop{border:1.5px dashed #3a3424;border-radius:14px;padding:20px 12px;text-align:center;background:#0d0d0d}
.fname{margin-top:10px;font-size:13px;color:var(--gold2);word-break:break-all}
.lbl{display:block;margin:14px 0 8px;font-size:11px;letter-spacing:.08em;color:#bbb;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,select,input{border:1px solid #333;background:#101010;color:#eee;border-radius:12px;padding:8px 12px}
.chip{border-radius:999px;font-weight:600}
.chip.on{background:var(--btn);color:#111;border-color:var(--btn)}
select,input[type=url],input[type=text],input[type=number]{width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;margin-top:12px;background:var(--btn);color:#111;border:0;border-radius:14px;padding:15px;font-weight:800;letter-spacing:.07em}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid #3a3118}
.btn:disabled{opacity:.45}
.status{margin-top:12px;font-size:13px;color:var(--muted)}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(7,7,7,.94);border-top:1px solid #1b1b1b;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:0;border:0;color:#888;font-size:11px;font-weight:700;padding:8px 2px}
.tabs button.on{color:var(--gold2)}
.hidden{display:none!important}
a.link{color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="mark">R . M . P</div><h1>STUDIO</h1></div><div><img class="logo" src="icon.svg" alt="R.M.P"/><div class="sub">REAL MENTE PODER</div></div></header>
<p class="tag">Convierte, recorta, comprime y descarga.</p>
<div class="rule"></div>
<section class="grid">
<article class="card active" data-tool="video"><b>Video</b><br><span>MP4 WebM MOV GIF MP3</span></article>
<article class="card" data-tool="audio"><b>Audio</b><br><span>MP3 WAV AAC OGG M4A</span></article>
<article class="card" data-tool="image"><b>Imagen</b><br><span>JPG PNG WEBP recorte</span></article>
<article class="card" data-tool="file"><b>Archivo</b><br><span>URL ZIP Vault</span></article>
</section>
<section class="work" id="panel-media">
<div class="drop" id="drop"><b>Toca para elegir archivo</b><input id="file" type="file" class="hidden"/><div class="fname" id="fname"></div></div>
<label class="lbl">Formato</label><div class="chips" id="formats"></div>
<div id="imageOpts"><label class="lbl">Tamaño</label>
<select id="fit"><option value="original">Original</option><option value="1080">1080</option><option value="tiktok">TikTok 9:16</option><option value="square">1:1</option></select></div>
<div id="trimWrap" class="hidden"><label class="lbl">Recorte s</label><div class="row"><input type="number" id="tStart" placeholder="Inicio"/><input type="number" id="tEnd" placeholder="Fin"/></div></div>
<label class="lbl">Calidad <span id="qval">80</span></label><input type="range" id="quality" min="40" max="100" value="80"/>
<button class="btn" id="convertBtn" disabled>CONVERTIR Y DESCARGAR</button>
<div class="row"><button class="btn ghost" id="audioBtn">EXTRAER AUDIO</button></div>
<p class="status" id="status"></p>
</section>
<section class="work hidden" id="panel-file">
<p>Vault: <a class="link" href="vault.html">MENTAL STATE</a></p>
<label class="lbl">URL</label><input type="url" id="url" placeholder="https://..."/>
<button class="btn" id="dlUrlBtn">DESCARGAR</button>
<label class="lbl">ZIP</label>
<div class="drop" id="dropZip"><b>Varios archivos</b><input id="zipFiles" type="file" multiple class="hidden"/><div class="fname" id="znames"></div></div>
<button class="btn" id="zipBtn">CREAR ZIP</button>
<p class="status" id="zstatus"></p>
</section>
</div>
<footer><div class="tabs">
<button class="on" data-go="video">Video</button>
<button data-go="audio">Audio</button>
<button data-go="image">Imagen</button>
<button data-go="file">Archivo</button>
<button data-go="vault">Vault</button>
</div></footer>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const TOOLS={video:{accept:"video/*",formats:["mp4","webm","gif","mp3"]},audio:{accept:"audio/*",formats:["mp3","wav","m4a"]},image:{accept:"image/*",formats:["jpg","png","webp"]},file:{accept:"*/*",formats:[]}};
let tool="video",file=null,zipList=[],fmt="mp4";
const $=id=>document.getElementById(id);
function setStatus(m){$("status").textContent=m||"";}
function outName(s,e){return s.replace(/\.[^.]+$/,"")+"-RMP."+e;}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function renderFormats(){const list=TOOLS[tool].formats;$("formats").innerHTML="";fmt=list[0]||"";list.forEach((f,i)=>{const b=document.createElement("button");b.className="chip"+(i?"":" on");b.textContent=f.toUpperCase();b.onclick=()=>{fmt=f;[...$("formats").children].forEach(c=>c.classList.remove("on"));b.classList.add("on");};$("formats").appendChild(b);});}
function setTool(next){if(next==="vault"){location.href="vault.html";return;}tool=next;document.querySelectorAll(".card").forEach(c=>c.classList.toggle("active",c.dataset.tool===next));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.go===next));$("panel-media").classList.toggle("hidden",next==="file");$("panel-file").classList.toggle("hidden",next!=="file");$("imageOpts").classList.toggle("hidden",next!=="image");$("trimWrap").classList.toggle("hidden",next!=="video"&&next!=="audio");$("audioBtn").classList.toggle("hidden",next!=="video");$("file").accept=TOOLS[next]?.accept||"*/*";file=null;$("fname").textContent="";$("convertBtn").disabled=true;if(next!=="file")renderFormats();}
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>setTool(c.dataset.tool));
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTool(b.dataset.go));
$("quality").oninput=()=>$("qval").textContent=$("quality").value;
function bind(z,p,fn){z.onclick=()=>p.click();p.onchange=()=>{if(p.files.length)fn([...p.files]);};}
bind($("drop"),$("file"),files=>{file=files[0];window.batchImages=files.filter(f=>f.type.startsWith("image/"));$("fname").textContent=files.map(f=>f.name).join(", ");$("convertBtn").disabled=false;});
bind($("dropZip"),$("zipFiles"),files=>{zipList=files;$("znames").textContent=files.map(f=>f.name).join(", ");});
async function raster(f,ext,q){const bmp=await createImageBitmap(f);let tw=bmp.width,th=bmp.height;const fit=$("fit").value;if(fit==="1080"){tw=1080;th=Math.round(bmp.height*1080/bmp.width);}if(fit==="square"){tw=th=1080;}if(fit==="tiktok"){tw=1080;th=1920;}const c=document.createElement("canvas");c.width=tw;c.height=th;const ctx=c.getContext("2d");ctx.fillStyle="#000";ctx.fillRect(0,0,tw,th);const sc=Math.max(tw/bmp.width,th/bmp.height);ctx.drawImage(bmp,(tw-bmp.width*sc)/2,(th-bmp.height*sc)/2,bmp.width*sc,bmp.height*sc);const mime=ext==="jpg"?"image/jpeg":ext==="webp"?"image/webp":"image/png";return new Promise(r=>c.toBlob(r,mime,q/100));}
let ffmpeg,ready=false;
async function loadFF(){if(ready)return;const {FFmpeg}=FFmpegWASM;const {toBlobURL}=FFmpegUtil;ffmpeg=new FFmpeg();const base="https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";await ffmpeg.load({coreURL:await toBlobURL(base+"/ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm")});ready=true;}
async function convertMedia(f,ext,forceAudio){await loadFF();const {fetchFile}=FFmpegUtil;const inn="in.bin";const outExt=forceAudio?"mp3":ext;const out="out."+outExt;await ffmpeg.writeFile(inn,await fetchFile(f));const trim=[];if($("tStart").value)trim.push("-ss",$("tStart").value);if($("tEnd").value)trim.push("-to",$("tEnd").value);let mid=forceAudio||outExt==="mp3"?["-vn","-acodec","libmp3lame"]:outExt==="gif"?["-vf","fps=12,scale=480:-1"]:["-c:v","libx264","-pix_fmt","yuv420p","-c:a","aac"];await ffmpeg.exec(["-i",inn,...trim,...mid,"-y",out]);const data=await ffmpeg.readFile(out);return {blob:new Blob([data.buffer]),name:outName(f.name,outExt)};}
async function run(forceAudio){if(!file)return;$("convertBtn").disabled=true;try{if(tool==="image"){const blob=await raster(file,fmt,+$("quality").value);downloadBlob(blob,outName(file.name,fmt));setStatus("Listo.");}else{const r=await convertMedia(file,fmt,forceAudio);downloadBlob(r.blob,r.name);setStatus("Listo: "+r.name);}}catch(e){setStatus("Fallo. Usa HTTPS o archivo más liviano.");}finally{$("convertBtn").disabled=false;}}
$("convertBtn").onclick=()=>run(false);$("audioBtn").onclick=()=>run(true);
$("dlUrlBtn").onclick=async()=>{const url=$("url").value.trim();if(!url)return;try{const blob=await (await fetch(url)).blob();downloadBlob(blob,url.split("/").pop()||"archivo");$("zstatus").textContent="Descargado.";}catch{$("zstatus").textContent="CORS bloqueó el link.";}};
$("zipBtn").onclick=()=>{$("zstatus").textContent=zipList.length?"El ZIP completo está en el paquete local.":"Elige archivos.";};
renderFormats();
</script>
</body>
</html>
