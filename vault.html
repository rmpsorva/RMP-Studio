<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>R.M.P — MENTAL STATE</title>
  <style>
    :root { --bg:#0a0a0a; --gold:#c9a227; --text:#f2f2f2; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; min-height:100%; }
    .wrap { max-width:430px; margin:0 auto; padding:28px 20px 80px; }
    .brand-row { display:flex; justify-content:space-between; }
    .brand-left { letter-spacing:.28em; font-size:11px; font-weight:600; color:var(--gold); }
    .brand-right { letter-spacing:.16em; font-size:11px; color:#d0d0d0; }
    h1 { margin-top:10px; font-size:34px; font-weight:800; }
    .rule { height:1px; background:linear-gradient(90deg,#b8943a,transparent 80%); margin:16px 0 22px; opacity:.55; }
    .player { width:100%; aspect-ratio:16/9; border-radius:16px; background:#111; border:1px solid #1c1c1c; }
    .btn { display:block; width:100%; margin-top:18px; color:#e0c36a; text-align:center; text-decoration:none; font-weight:800; letter-spacing:.08em; border:1px solid #3a3118; border-radius:16px; padding:16px; }
    .note { margin-top:28px; font-size:12px; color:#8a8a8a; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row">
      <div class="brand-left">R . M . P</div>
      <div class="brand-right">REAL MENTE PODER</div>
    </div>
    <h1>MENTAL STATE</h1>
    <div class="rule"></div>
    <div class="player"></div>
    <a class="btn" href="index.html">VOLVER A STUDIO</a>
    <p class="note">R.M.P · MENTAL STATE</p>
  </div>
</body>
</html>
